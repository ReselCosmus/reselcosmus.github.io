<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>[༄𝐃𝐀𝐯𝐄❦] | A World of Hansa | Alt-GeoRP PDA</title>

<style>

body{
background:#0b0f0e;
color:#00ff9c;
font-family:monospace;
margin:0;
}

header{
background:#021d16;
padding:15px;
text-align:center;
border-bottom:2px solid #00ff9c;
}

.container{
display:flex;
height:90vh;
}

.sidebar{
width:240px;
background:#031b15;
border-right:1px solid #00ff9c;
padding:10px;
}

.sidebar button{
width:100%;
margin-bottom:10px;
padding:10px;
background:black;
color:#00ff9c;
border:1px solid #00ff9c;
cursor:pointer;
}

.main{
flex:1;
padding:20px;
overflow:auto;
}

input, textarea{
width:100%;
background:black;
color:#00ff9c;
border:1px solid #00ff9c;
padding:8px;
margin-top:5px;
font-family:monospace;
}

textarea{
height:120px;
}

button.enviar{
margin-top:10px;
padding:10px;
background:#00ff9c;
border:none;
color:black;
font-weight:bold;
cursor:pointer;
}

.log{
margin-top:20px;
}

.entry{
border-bottom:1px solid #00ff9c33;
padding:10px;
margin-bottom:20px;
}

.entry img{
max-width:300px;
margin-top:10px;
border:1px solid #00ff9c;
}

.time{
font-size:12px;
color:#00ffaa88;
}

</style>

</head>

<body>

<header>
<h2>[༄𝐃𝐀𝐯𝐄❦] | A World of Hansa | Alt-GeoRP</h2>
Sistema PDA | Inteligencia Global
</header>

<div class="container">

<div class="sidebar">

<button onclick="categoria('militar')">Militar</button>
<button onclick="categoria('politica')">Política</button>
<button onclick="categoria('inteligencia')">Inteligencia</button>
<button onclick="categoria('economia')">Economía</button>

</div>

<div class="main">

<h2 id="titulo">Registro</h2>

<label>Bandera (emoji)</label>
<input id="bandera" placeholder="Ej: 🇺🇸 🇷🇺 🇨🇳">

<label>Título</label>
<input id="tituloInput" placeholder="Título del informe">

<label>Fecha</label>
<input type="date" id="fecha">

<label>Información</label>
<textarea id="texto" placeholder="Escribe el informe..."></textarea>

<label>Imagen</label>
<input type="file" id="imagen">

<button class="enviar" onclick="enviar()">SUBIR INFORME</button>

<div class="log" id="log"></div>

</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
import { getStorage, ref as refStorage, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-storage.js";

const firebaseConfig = {

apiKey: "AIzaSyCYfCPTM73h65iJ9HRW94rbRHYzwuqyXS0",
authDomain: "world-of-hansa.firebaseapp.com",
databaseURL: "https://world-of-hansa-default-rtdb.firebaseio.com",
projectId: "world-of-hansa",
storageBucket: "world-of-hansa.firebasestorage.app",
messagingSenderId: "834898494569",
appId: "1:834898494569:web:63f0869993e73bb01c4ef8",
measurementId: "G-C0LNTV3RQZ"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);

let categoriaActual = "militar";

window.categoria = function(cat){

categoriaActual = cat;

document.getElementById("titulo").innerText = "Registro - " + cat;

cargar();

}

window.enviar = async function(){

const bandera = document.getElementById("bandera").value;
const titulo = document.getElementById("tituloInput").value;
const fecha = document.getElementById("fecha").value;
const texto = document.getElementById("texto").value;
const imagen = document.getElementById("imagen").files[0];

let imagenURL = "";

if(imagen){

const storageRef = refStorage(storage,"imagenes/"+Date.now()+imagen.name);

await uploadBytes(storageRef,imagen);

imagenURL = await getDownloadURL(storageRef);

}

push(ref(db,"pda/"+categoriaActual),{

bandera,
titulo,
fecha,
texto,
imagen:imagenURL

});

document.getElementById("bandera").value="";
document.getElementById("tituloInput").value="";
document.getElementById("fecha").value="";
document.getElementById("texto").value="";
document.getElementById("imagen").value="";

}

function cargar(){

const log = document.getElementById("log");

onValue(ref(db,"pda/"+categoriaActual),(snapshot)=>{

log.innerHTML="";

snapshot.forEach((child)=>{

const data = child.val();

const div = document.createElement("div");

div.className="entry";

div.innerHTML = `

<h3>${data.bandera} ${data.titulo}</h3>

<div class="time">${data.fecha}</div>

<p>${data.texto}</p>

${data.imagen ? `<img src="${data.imagen}">` : ""}

`;

log.prepend(div);

});

});

}

cargar();

</script>

</body>
</html>
