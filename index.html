<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>[༄𝐃𝐀𝐯𝐄❦] | A World of Hansa | Alt-GeoRP PDA</title>

<style>

body{
background:#0a0f0e;
color:#00ff9c;
font-family:monospace;
margin:0;
}

header{
background:#021d16;
padding:15px;
text-align:center;
border-bottom:2px solid #00ff9c;
}

.container{
display:flex;
height:90vh;
}

.sidebar{
width:240px;
background:#031b15;
border-right:1px solid #00ff9c;
padding:10px;
}

.sidebar button{
width:100%;
padding:10px;
margin-bottom:10px;
background:black;
color:#00ff9c;
border:1px solid #00ff9c;
cursor:pointer;
}

.sidebar button:hover{
background:#002b22;
}

.main{
flex:1;
padding:20px;
overflow:auto;
}

textarea{
width:100%;
height:120px;
background:black;
color:#00ff9c;
border:1px solid #00ff9c;
padding:10px;
font-family:monospace;
}

button.enviar{
margin-top:10px;
padding:10px;
background:#00ff9c;
border:none;
color:black;
font-weight:bold;
cursor:pointer;
}

.log{
margin-top:20px;
}

.entry{
border-bottom:1px solid #00ff9c33;
padding:10px;
margin-bottom:10px;
}

.time{
font-size:12px;
color:#00ffaa88;
}

</style>

</head>

<body>

<header>
<h2>[༄𝐃𝐀𝐯𝐄❦] | A World of Hansa | Alt-GeoRP</h2>
Sistema PDA — Red de Información Global
</header>

<div class="container">

<div class="sidebar">

<button onclick="categoria('militar')">Actualizaciones Militares</button>
<button onclick="categoria('politica')">Eventos Políticos</button>
<button onclick="categoria('inteligencia')">Inteligencia</button>
<button onclick="categoria('economia')">Economía</button>

</div>

<div class="main">

<h2 id="titulo">Registro Militar</h2>

<textarea id="texto" placeholder="Escribe el informe..."></textarea>

<br>

<button class="enviar" onclick="enviar()">SUBIR INFORME</button>

<div class="log" id="log"></div>

</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyCYfCPTM73h65iJ9HRW94rbRHYzwuqyXS0",
authDomain: "world-of-hansa.firebaseapp.com",
databaseURL: "https://world-of-hansa-default-rtdb.firebaseio.com",
projectId: "world-of-hansa",
storageBucket: "world-of-hansa.firebasestorage.app",
messagingSenderId: "834898494569",
appId: "1:834898494569:web:63f0869993e73bb01c4ef8",
measurementId: "G-C0LNTV3RQZ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let categoriaActual = "militar";

window.categoria = function(cat){

categoriaActual = cat;

document.getElementById("titulo").innerText = "Registro - " + cat;

cargar();

}

window.enviar = function(){

const texto = document.getElementById("texto").value;

if(texto.trim() === "") return;

push(ref(db,"pda/"+categoriaActual),{

texto:texto,
fecha:new Date().toLocaleString()

});

document.getElementById("texto").value="";

}

function cargar(){

const log = document.getElementById("log");

onValue(ref(db,"pda/"+categoriaActual),(snapshot)=>{

log.innerHTML="";

snapshot.forEach((child)=>{

const data = child.val();

const div = document.createElement("div");

div.className="entry";

div.innerHTML = `
<div>${data.texto}</div>
<div class="time">${data.fecha}</div>
`;

log.prepend(div);

});

});

}

cargar();

</script>

</body>
</html>
